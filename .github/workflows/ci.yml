name: CI Unificado — Waesy Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: 5 Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Gate 1 — TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Gate 2 — Design System Lint Ratchet
        run: node scripts/design-lint.mjs --ratchet

      - name: Gate 3 — Automated Unit & Integration Tests
        run: npm run test

      - name: Gate 4 — Production Edge Worker Build
        run: npm run build

      - name: Gate 5 — Dead Code & Duplicate Components Detector
        run: node scripts/dead-code-detector.mjs --ci

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waesy-quality-reports
          path: |
            design-lint.report.json
            dead-code.report.json
          retention-days: 14
