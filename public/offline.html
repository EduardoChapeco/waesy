<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Waesy</title>
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --card-bg: #f4f4f5;
      --border: #e4e4e7;
      --primary: #09090b;
      --primary-fg: #ffffff;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --card-bg: #18181b;
        --border: #27272a;
        --primary: #ffffff;
        --primary-fg: #09090b;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(113, 113, 122, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .btn {
      width: 100%;
      min-height: 44px;
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .footer-links {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
    }
    .footer-links a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M12 18h.01M8.5 14.5A5 5 0 0112 13m0 0a5 5 0 013.5 1.5M5.5 10.5A9 9 0 0112 8m0 0c2.3 0 4.4.9 6 2.3M2 6.5A13 13 0 0112 3c3.4 0 6.6 1.3 9 3.5" />
      </svg>
    </div>

    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span id="badge-text">Sem Conexão</span>
    </div>

    <h1>Você está offline</h1>
    <p id="status-desc">
      Não foi possível carregar esta página. Verifique seu sinal de Wi-Fi ou dados móveis. Assim que o sinal for restabelecido, reconectaremos automaticamente.
    </p>

    <button type="button" class="btn" onclick="retryConnection()" id="retry-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Tentar Reconectar
    </button>

    <div class="footer-links">
      <a href="/">Ir para Início</a>
      <a href="/conta">Minha Conta</a>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      btn.style.opacity = '0.7';
      btn.textContent = 'Verificando conexão...';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          btn.style.opacity = '1';
          btn.textContent = 'Ainda sem internet — Tentar de novo';
        }, 1200);
      }
    }

    window.addEventListener('online', () => {
      const desc = document.getElementById('status-desc');
      const badge = document.getElementById('badge-text');
      badge.textContent = 'Conectado!';
      badge.parentElement.style.color = '#10b981';
      badge.parentElement.style.background = 'rgba(16, 185, 129, 0.1)';
      document.querySelector('.pulse-dot').style.background = '#10b981';
      desc.textContent = 'Conexão restabelecida! Recarregando a página...';
      setTimeout(() => {
        window.location.reload();
      }, 800);
    });
  </script>
</body>
</html>
